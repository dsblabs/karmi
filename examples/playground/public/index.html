<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>karmi Playground</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <form id="gate" hidden>
      <h1>karmi Playground</h1>
      <p>Enter the access token that <code>pnpm setup</code> printed.</p>
      <input id="token" type="password" autocomplete="off" aria-label="Access token" required />
      <button>Open</button>
      <p id="gate-error" class="error" role="alert"></p>
    </form>
    <div id="app" hidden>
      <header>
        <strong>karmi Playground</strong>
        <span id="provider"></span>
        <button id="forget" class="quiet">Forget token</button>
      </header>
      <nav>
        <h2>Scenarios</h2>
        <ul id="scenarios"></ul>
        <a href="#coverage">Feature coverage</a>
      </nav>
      <main id="main"></main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
