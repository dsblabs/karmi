# Vale checks prose against docs/agents/writing.md. Run `pnpm prose:check`.
# The file list is in the `prose:check` script in package.json.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Karmi

# CONTEXT.md lists the avoided phrases on purpose.
[CONTEXT.md]
Karmi.Terms = NO
